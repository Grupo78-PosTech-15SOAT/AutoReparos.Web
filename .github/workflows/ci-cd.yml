name: CI/CD - AutoReparos.Web

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      ignorar_quality:
        description: Implantar mesmo com o quality vermelho (uso manual; build e test continuam obrigatórios)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Na main não cancela: um deploy interrompido deixaria a release do Helm presa em pending-upgrade.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test --watch=false --coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura-web
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  quality:
    needs: test
    # Push ou disparo manual na main e PR para a main. A primeira análise de uma branch no SonarCloud não tem linha
    # de base de código novo: o quality gate fica NONE e o scanner sai com código 3 (run 43251757645, 12/11); a
    # análise seguinte da mesma branch já compara com a anterior.
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'grupo78-postech-15soat' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Grupo78-PosTech-15SOAT_AutoReparos.Web' }}
    steps:
      - name: Exigir SONAR_TOKEN
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Segredo SONAR_TOKEN ausente: o quality gate do SonarCloud é obrigatório"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cobertura-web
          path: coverage/
      - name: Analisar no SonarCloud e aguardar quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  # Implanta o Web na produção (EKS): só na main, depois de build, test e quality (ou do disparo manual com
  # ignorar_quality) e no Environment production. Imagem -> ECR autoreparos-web -> Helm com --atomic -> rollout -> GET /.
  deploy:
    needs: [build, test, quality]
    # Push na main: só com build, test e quality verdes. Disparo manual na main com ignorar_quality: aceita o quality
    # vermelho, mas nunca build ou test vermelhos (igual ao Cadastros, D-60). !cancelled() em vez de always(): um run
    # cancelado não implanta.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.test.result == 'success' && (needs.quality.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.ignorar_quality)) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: autoreparos-web
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.4
      - name: Publicar a imagem no ECR
        id: imagem
        run: |
          set -euo pipefail
          conta="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="$conta.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f Dockerfile .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
      - name: Conectar ao EKS
        run: aws eks update-kubeconfig --name '${{ vars.EKS_CLUSTER_NAME }}' --region "$AWS_REGION"
      - name: Implantar com Helm
        env:
          REGISTRY: ${{ steps.imagem.outputs.registry }}
        run: |
          set -euo pipefail
          # O namespace web é da plataforma (stacks/base); a role só edita dentro dele.
          helm upgrade --install web deploy/helm/web \
            --namespace web --atomic --wait --timeout 10m \
            --set-string "image.repository=$REGISTRY/$ECR_REPOSITORY" \
            --set-string "image.tag=$IMAGE_TAG"
      - name: Verificar o rollout e o GET /
        run: |
          set -euo pipefail
          kubectl rollout status deployment/autoreparos-web -n web --timeout=5m
          kubectl port-forward -n web service/autoreparos-web 18080:80 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          encaminhamento=$!
          trap 'kill "$encaminhamento" 2>/dev/null || true' EXIT
          status=000
          for tentativa in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)
            [ "$status" = "200" ] && break
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "::error::GET / no Service autoreparos-web respondeu $status em vez de 200"
            cat "$RUNNER_TEMP/port-forward.log" || true
            exit 1
          fi
          echo "GET / respondeu 200"
